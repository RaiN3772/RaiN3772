eration Mono', monospace" font-size="13" fill="#93a9b3" letter-spacing="1">SERVICES</text><rect x="48" y="252" width="258" height="92" rx="12" fill="#13232b" stroke="#c8e27e" stroke-opacity="0.28"/><text x="66" y="284" font-size="18" font-weight="700" fill="#eaf4f7">Feature flags</text><text x="66" y="308" font-size="14" fill="#93a9b3">edge worker · KV · kill switch</text><rect x="322" y="252" width="532" height="92" rx="12" fill="#16303a" stroke="#7cc4ef" stroke-opacity="0.7"/><text x="340" y="284" font-size="18" font-weight="700" fill="#eaf4f7">Qutrek API + workers</text><text x="340" y="308" font-size="14" fill="#93a9b3">Bun · Express 5 · Socket.IO · BullMQ job workers</text><rect x="870" y="252" width="282" height="92" rx="12" fill="#13232b" stroke="#c8e27e" stroke-opacity="0.28"/><text x="888" y="284" font-size="18" font-weight="700" fill="#eaf4f7">Map tiles</text><text x="888" y="308" font-size="14" fill="#93a9b3">self-hosted Protomaps + terrain</text><line x1="177" y1="190" x2="177" y2="252" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><line x1="588" y1="190" x2="588" y2="252" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><line x1="1011" y1="190" x2="1011" y2="252" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><text x="48" y="392" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#93a9b3" letter-spacing="1">DATA</text><line x1="154.0" y1="376" x2="1054.0" y2="376" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><line x1="588" y1="344" x2="588" y2="376" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><line x1="154.0" y1="376" x2="154.0" y2="408" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><rect x="48" y="408" width="212" height="78" rx="12" fill="#13232b" stroke="#7cc4ef" stroke-opacity="0.28"/><text x="66" y="440" font-size="18" font-weight="700" fill="#eaf4f7">PostgreSQL</text><text x="66" y="464" font-size="14" fill="#93a9b3">Prisma · core data</text><line x1="379.0" y1="376" x2="379.0" y2="408" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><rect x="273" y="408" width="212" height="78" rx="12" fill="#13232b" stroke="#7cc4ef" stroke-opacity="0.28"/><text x="291" y="440" font-size="18" font-weight="700" fill="#eaf4f7">Redis</text><text x="291" y="464" font-size="14" fill="#93a9b3">cache · queues · live</text><line x1="604.0" y1="376" x2="604.0" y2="408" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><rect x="498" y="408" width="212" height="78" rx="12" fill="#13232b" stroke="#7cc4ef" stroke-opacity="0.28"/><text x="516" y="440" font-size="18" font-weight="700" fill="#eaf4f7">S3 storage</text><text x="516" y="464" font-size="14" fill="#93a9b3">photos · video</text><line x1="829.0" y1="376" x2="829.0" y2="408" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><rect x="723" y="408" width="212" height="78" rx="12" fill="#13232b" stroke="#7cc4ef" stroke-opacity="0.28"/><text x="741" y="440" font-size="18" font-weight="700" fill="#eaf4f7">ClickHouse</text><text x="741" y="464" font-size="14" fill="#93a9b3">analytics events</text><line x1="1054.0" y1="376" x2="1054.0" y2="408" stroke="#7cc4ef" stroke-opacity="0.45" stroke-width="2"/><rect x="948" y="408" width="212" height="78" rx="12" fill="#13232b" stroke="#7cc4ef" stroke-opacity="0.28"/><text x="966" y="440" font-size="18" font-weight="700" fill="#eaf4f7">Firebase</text><text x="966" y="464" font-size="14" fill="#93a9b3">sign-in · push</text><text x="48" y="534" font-size="14" fill="#93a9b3">No third-party analytics, flag or map vendor in the runtime path. Every event comes from one tracking plan that generates typed SDKs.</text></g>
